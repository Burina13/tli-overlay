[package]
name = "tli-overlay"
version = "0.31.0"
edition = "2021"
description = "Tvoj Tatko TLI Overlay"
authors = ["Tvoj Tatko"]
default-run = "tli-overlay"

[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-dialog = "2"
# Windows notifikácia pre pripomienku „Enable Log" (TLI 11d) — volaná priamo
# z Rustu (`NotificationExt`), nie z JS, takže nepotrebuje capabilities.
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tli-overlay-core = { path = "../core" }
image = { version = "0.25", default-features = false, features = ["jpeg"] }
ureq = "2"
# Gzip pre denný upload logov (TLI 14) — server posiela surový log vždy
# zabalený, nikdy nekomprimovaný (`stacks/games/tli-web/app.py`).
flate2 = "1"
# Živé sledovanie logu (TLI 11c) — primárne cez udalosti FS, 1s polling je
# len záložka pre prípad, že by sa udalosť stratila (notify to pripúšťa samo).
notify = "8"
# Lokálna databáza trackera (TLI 13) — `bundled` kompiluje sqlite priamo (cez
# `cc`/MSVC na Windows), žiadna systémová DLL navyše.
rusqlite = { version = "0.40.2", features = ["bundled"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.58.0", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Dwm",
  "Win32_UI_WindowsAndMessaging",
  # TLI 58 — `GetAsyncKeyState` + `VK_LBUTTON`/`VK_RBUTTON` na zistenie, či
  # hráč klikol myšou (skrytie rady až po kliku, nie po čase).
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_System_Threading",
  # TLI 59b časť 2 — `Windows::Media::Ocr` na čítanie textu cieľa miešania
  # a `Current Max Paint Level` z obrazovky Frozen Canvasu (`src/ocr.rs`).
  # `SoftwareBitmap` (Graphics_Imaging) je vstup OCR enginu, `DataWriter`/
  # `IBuffer` (Storage_Streams) je jediná cesta, ako doň dostať surové RGB
  # bajty zo `snimka::Snimka` bez prechodu cez súbor na disku.
  "Media_Ocr",
  "Graphics_Imaging",
  "Storage_Streams",
] }
# Čítanie Steam inštalácie z registra (TLI 11c) — len Windows, appka aj tak
# beží len tam.
winreg = "0.56"
# `WebviewWindow::hwnd()` vracia `windows::...::HWND` z INEJ (vnútornej)
# verzie kraty `windows`, než akú máme pripnutú vyššie (`0.58.0` vs. Tauriho
# `0.62.x`) — Rust ich berie ako dva rôzne typy a `SetForegroundWindow` by
# ten „cudzí" HWND odmietol (TLI 40, zistené priamo z chyby Windows CI).
# `raw-window-handle` je naopak jediná spoločná, verzovo stabilná cesta k
# HWND (Tauri ju používa interne rovnako), preto sa cez ňu HWND získava ako
# obyčajné číslo a až z neho sa postaví NÁŠ `windows::...::HWND`.
raw-window-handle = "0.6"

[profile.release]
strip = true
lto = true
codegen-units = 1
