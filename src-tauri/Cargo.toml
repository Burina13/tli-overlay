[package]
name = "tli-overlay"
version = "0.17.1"
edition = "2021"
description = "Tvoj Tatko TLI Overlay"
authors = ["Tvoj Tatko"]
default-run = "tli-overlay"

[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-dialog = "2"
# Windows notifikácia pre pripomienku „Enable Log" (TLI 11d) — volaná priamo
# z Rustu (`NotificationExt`), nie z JS, takže nepotrebuje capabilities.
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tli-overlay-core = { path = "../core" }
image = { version = "0.25", default-features = false, features = ["jpeg"] }
ureq = "2"
# Gzip pre denný upload logov (TLI 14) — server posiela surový log vždy
# zabalený, nikdy nekomprimovaný (`stacks/games/tli-web/app.py`).
flate2 = "1"
# Živé sledovanie logu (TLI 11c) — primárne cez udalosti FS, 1s polling je
# len záložka pre prípad, že by sa udalosť stratila (notify to pripúšťa samo).
notify = "8"
# Lokálna databáza trackera (TLI 13) — `bundled` kompiluje sqlite priamo (cez
# `cc`/MSVC na Windows), žiadna systémová DLL navyše.
rusqlite = { version = "0.40.2", features = ["bundled"] }

[dev-dependencies]
# `tauri::test` (TLI 23) — len pre `tests/e2e_okna.rs`, nejde do vydanej appky
# (feature sa pridá len pri `cargo test`, nie pri bežnom `build`/`bundle`).
tauri = { version = "2", features = ["test"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.58.0", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Dwm",
  "Win32_UI_WindowsAndMessaging",
  "Win32_System_Threading",
] }
# Čítanie Steam inštalácie z registra (TLI 11c) — len Windows, appka aj tak
# beží len tam.
winreg = "0.56"

[profile.release]
strip = true
lto = true
codegen-units = 1
