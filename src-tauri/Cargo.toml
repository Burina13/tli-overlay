[package]
name = "tli-overlay"
version = "0.8.0"
edition = "2021"
description = "Tvoj Tatko TLI Overlay"
authors = ["Tvoj Tatko"]
default-run = "tli-overlay"

[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tli-overlay-core = { path = "../core" }
image = { version = "0.25", default-features = false, features = ["jpeg"] }
ureq = "2"

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.58.0", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Dwm",
  "Win32_UI_WindowsAndMessaging",
  "Win32_System_Threading",
] }

[profile.release]
strip = true
lto = true
codegen-units = 1
