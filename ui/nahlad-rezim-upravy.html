<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <title>Náhľad overlayu — Upraviť rozloženie</title>
    <script src="nahlad-stub.js"></script>
    <link rel="stylesheet" href="overlay.css">
    <link rel="stylesheet" href="nahlad.css">
</head>
<body>
    <div id="indikator" class="skryte">
        <div class="kruzok"></div>
        <span>Analyzujem…</span>
    </div>
    <div id="chyba" class="skryte"></div>
    <div id="vrstva"></div>

    <!-- TLI 25 — lišta prepínača modulov v režime „Upraviť rozloženie".
         Je VON z panela zámerne: vnútri by sa orezala v momente, keď si
         hráč panel zmenší — a práve to je to, čo v režime úpravy robí. -->
    <div id="rezim-lista" class="skryte"></div>
    <svg id="sipka" class="skryte" xmlns="http://www.w3.org/2000/svg">
        <defs>
            <marker id="hrot" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                <path d="M 0 0 L 10 5 L 0 10 z" fill="#ff962c"></path>
            </marker>
        </defs>
        <line id="sipka-ciara" x1="0" y1="0" x2="0" y2="0" stroke="#ff962c" stroke-width="3" stroke-dasharray="6,4" marker-end="url(#hrot)"></line>
    </svg>
    <div id="panel" class="skryte">
        <div id="panel-uchyt-presun">⠿ presuň — Enter/Esc uloží</div>
        <h1 id="panel-nadpis"></h1>
        <div id="panel-istota"></div>
        <div id="panel-ikony" class="skryte"></div>
        <p id="panel-dovod"></p>
        <div id="panel-skontroluj" class="skryte"></div>
        <div id="panel-alternativy" class="skryte"></div>
        <div id="panel-uchyt-velkost" title="Ťahaním zmeníš veľkosť"></div>
    </div>
    <script src="ikony.js"></script>
    <script src="overlay.js"></script>
    <script src="nahlad-rezim-upravy.js"></script>
</body>
</html>
