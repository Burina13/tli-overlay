<!DOCTYPE html>
<html lang="sk" data-tema="svetla">
<head>
    <meta charset="UTF-8">
    <title>Tvoj Tatko TLI Overlay — pripomienka</title>
    <link rel="stylesheet" href="pripomienka.css">
</head>
<body>
    <!-- Toast pripomienky „Enable Log" (TLI 11d). Rust (ukaz_pripomienku)
         rozhoduje o polohe, zobrazení aj automatickom skrytí — toto okno len
         vykresľuje text a farbu podľa udalosti `pripomienka-obsah`. -->
    <div class="toast" id="toast">
        <span id="toast-text"></span>
    </div>
    <script src="pripomienka.js"></script>
</body>
</html>
