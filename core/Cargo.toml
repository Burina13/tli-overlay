[package]
name = "tli-overlay-core"
version = "0.22.0"
edition = "2021"

[workspace]

[dependencies]
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Overenie SHA256 stiahnutého inštalátora pri tichej aktualizácii (TLI 52,
# časť 2/2) — čistý Rust, žiadna systémová závislosť, beží aj na Linuxe v CI.
sha2 = "0.10"
