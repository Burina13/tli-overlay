# Testy. Jadro (čistá logika) beží na Linuxe a je hotové do minúty; appka sa
# zostavuje na Windowse, lebo inde sa Tauri s WebView2 ani nedá preložiť.
name: Testy

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  jadro:
    name: Jadro (prepočet súradníc, nastavenia, updater)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - run: cargo test --manifest-path core/Cargo.toml -- --nocapture

  ui_e2e:
    name: UI — klik na záložky a uloz_prepinac (jsdom, bez Tauri)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ui/package-lock.json
      - working-directory: ui
        run: npm ci
      - working-directory: ui
        run: npm test

  pravidla:
    name: Pravidlá ToS a pripnutý manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: V kóde nesmie byť zásah do hry ani simulácia vstupu
        run: |
          # Zadanie TLI 3/3: appka LEN číta obrazovku. Tento test je jediné miesto,
          # ktoré to drží aj po budúcich úpravách — preto hľadá API, nie dobré úmysly.
          zakazane='SendInput|mouse_event|keybd_event|ReadProcessMemory|WriteProcessMemory|VirtualAllocEx|CreateRemoteThread|SetWindowsHookEx|LoadLibraryA|D3D11|IDXGI|pcap|WinDivert|Detour'
          if grep -REn "$zakazane" src-tauri/src core/src ui 2>/dev/null; then
            echo "::error::Našiel sa zákaz z pravidiel ToS (zásah do hry alebo simulácia vstupu)."
            exit 1
          fi
          echo "OK — žiadne zakázané API."
      - name: Updater pozná len náš latest-tli.json
        run: |
          # Incident A2Tools 13.10.2026: cudzí manifest prepísal nášmu klientovi
          # inštaláciu. Jediná povolená adresa je konštanta v core/src/aktualizacia.rs.
          nase=$(grep -c 'raw.githubusercontent.com/Burina13/tli-overlay/main/latest-tli.json' core/src/aktualizacia.rs)
          test "$nase" -ge 1 || { echo "::error::MANIFEST_URL sa zmenil."; exit 1; }
          python3 - <<'PY'
          import pathlib, re, sys
          # Testy zámerne OBSAHUJÚ cudzie adresy (overujú, že ich zarážka odmietne),
          # takže sa z kontroly vystrihnú. Kontroluje sa kód, ktorý sa naozaj vykoná.
          POVOLENE = ("https://tli.tvojtatko.sk",
                      "https://raw.githubusercontent.com/Burina13/tli-overlay/")
          zle = []
          for subor in list(pathlib.Path("src-tauri/src").rglob("*.rs")) + \
                       list(pathlib.Path("core/src").rglob("*.rs")):
              text = subor.read_text(encoding="utf-8")
              text = re.split(r"#\[cfg\(test\)\]", text)[0]
              for cislo, riadok in enumerate(text.splitlines(), 1):
                  for najdena in re.findall(r"""https?://[^\s"'`)]+""", riadok):
                      if not any(najdena.startswith(p) for p in POVOLENE):
                          zle.append(f"{subor}:{cislo}: {najdena}")
          if zle:
              print("::error::V kóde je adresa mimo nášho servera a nášho repozitára:")
              print("\n".join(zle))
              sys.exit(1)
          print("OK — žiadny cudzí endpoint.")
          PY
      - name: Manifest latest-tli.json je platný JSON a ukazuje na nás
        run: |
          python3 - <<'PY'
          import json, sys
          m = json.load(open("latest-tli.json"))
          for k in ("version", "notes", "msiUrl", "msiSha256"):
              assert k in m, f"v manifeste chýba {k}"
          assert m["msiUrl"].startswith("https://github.com/Burina13/tli-overlay/releases/download/"), m["msiUrl"]
          print("OK —", m["version"])
          PY

  appka:
    name: Appka a E2E proti mock serveru (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Náhľad overlayu ako obrázok (artefakt behu)
        shell: pwsh
        run: |
          # Overlay je obyčajná stránka, takže sa dá vykresliť aj v Edge, ktorý je
          # na runneri predinštalovaný. `nahlad.html` podsunie `overlay.js` ukážkovú
          # odpoveď servera — teda presne to, čo nakreslí naživo nad hrou.
          $edge = @(
            "C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe",
            "C:\Program Files\Microsoft\Edge\Application\msedge.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $edge) { Write-Warning "Edge sa nenašiel, náhľad preskakujem."; exit 0 }
          $cesta = (Resolve-Path "ui/nahlad.html").Path
          # `--headless=new` prestalo byť platnou hodnotou (nová Chromium "headless new"
          # je dnes JEDINÝ režim, bez prepínača) — staršia appka s neplatným argumentom
          # skončila okamžite bez snímky, čo vyzeralo ako zamrznutie/preskočenie.
          $p = Start-Process -FilePath $edge -ArgumentList @(
            "--headless", "--disable-gpu", "--screenshot=$PWD\overlay-nahlad.png",
            "--window-size=1600,900", "--virtual-time-budget=4000",
            "file:///$($cesta -replace '\\','/')"
          ) -NoNewWindow -Wait -PassThru
          Write-Host "Edge exit code: $($p.ExitCode)"
          if (-not (Test-Path "overlay-nahlad.png")) { Write-Warning "Edge obrázok nevytvoril." }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: overlay-nahlad
          path: overlay-nahlad.png
          if-no-files-found: warn
      - name: Náhľad Frozen Canvas (TLI 4b) ako obrázok (artefakt behu)
        shell: pwsh
        run: |
          # Rovnaký mechanizmus ako vyššie, len `nahlad-canvas.html`/.js podsunie
          # mock odpoveď `faza: "hotovo_canvas"` — očíslované zelené rámiky
          # zdroj (ruka) + cieľ (plátno) na syntetickom boarde zo
          # `stacks/games/tli/engine/testy-canvas-solver.py`.
          $edge = @(
            "C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe",
            "C:\Program Files\Microsoft\Edge\Application\msedge.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $edge) { Write-Warning "Edge sa nenašiel, náhľad preskakujem."; exit 0 }
          $cesta = (Resolve-Path "ui/nahlad-canvas.html").Path
          $p = Start-Process -FilePath $edge -ArgumentList @(
            "--headless", "--disable-gpu", "--screenshot=$PWD\overlay-nahlad-canvas.png",
            "--window-size=1600,900", "--virtual-time-budget=4000",
            "file:///$($cesta -replace '\\','/')"
          ) -NoNewWindow -Wait -PassThru
          Write-Host "Edge exit code: $($p.ExitCode)"
          if (-not (Test-Path "overlay-nahlad-canvas.png")) { Write-Warning "Edge obrázok nevytvoril." }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: overlay-nahlad-canvas
          path: overlay-nahlad-canvas.png
          if-no-files-found: warn
      - name: Náhľad režimu „Upraviť rozloženie“ (TLI 21) ako obrázok (artefakt behu)
        shell: pwsh
        run: |
          # Rovnaký mechanizmus ako vyššie, len `nahlad-rezim-upravy.html`/.js
          # podsunie udalosť `rezim-upravy` — panel s úchytmi na presun/zmenu
          # veľkosti presne tak, ako appka vyzerá po Ctrl+F8.
          $edge = @(
            "C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe",
            "C:\Program Files\Microsoft\Edge\Application\msedge.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $edge) { Write-Warning "Edge sa nenašiel, náhľad preskakujem."; exit 0 }
          $cesta = (Resolve-Path "ui/nahlad-rezim-upravy.html").Path
          $p = Start-Process -FilePath $edge -ArgumentList @(
            "--headless", "--disable-gpu", "--screenshot=$PWD\overlay-nahlad-rezim-upravy.png",
            "--window-size=1600,900", "--virtual-time-budget=4000",
            "file:///$($cesta -replace '\\','/')"
          ) -NoNewWindow -Wait -PassThru
          Write-Host "Edge exit code: $($p.ExitCode)"
          if (-not (Test-Path "overlay-nahlad-rezim-upravy.png")) { Write-Warning "Edge obrázok nevytvoril." }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: overlay-nahlad-rezim-upravy
          path: overlay-nahlad-rezim-upravy.png
          if-no-files-found: warn
      - name: Náhľady — vygenerovať z ostrých súborov UI
        shell: bash
        run: python3 ui/nahlad-generuj.py

      - name: Náhľad hlavného okna so záložkami (TLI 11) ako obrázky
        shell: pwsh
        run: |
          # Rovnaký mechanizmus ako pri overlayi: vygenerované `nahlad-hlavne-*.html`
          # (= hlavne.html + nahlad-stub.js + prepnutá záložka) sa vykreslia v Edge,
          # ktorý je na runneri predinštalovaný.
          $edge = @(
            "C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe",
            "C:\Program Files\Microsoft\Edge\Application\msedge.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $edge) { Write-Warning "Edge sa nenašiel, náhľad preskakujem."; exit 0 }
          $zalozky = @("panel-tracker", "panel-solvery", "panel-analyza", "panel-guide", "panel-nastavenia")
          # Témy sa fotia OBE: od 0.7.0 je predvolená svetlá a tmavá je prepínač
          # v hlavičke — na screenshote musí byť vidieť, že obe naozaj fungujú.
          $temy = @("svetla", "tmava")
          foreach ($panel in $zalozky) {
            # Aktívna záložka je už prepnutá v HTML (`ui/nahlad-generuj.py`) —
            # `?tab=` sa na Windows runneri neprejavilo a všetky štyri snímky
            # z 0.9.0 ukazovali Tracker. `?tema=` tam funguje, to ostáva.
            $cesta = (Resolve-Path "ui/nahlad-hlavne-$panel.html").Path
            foreach ($tema in $temy) {
              $p = Start-Process -FilePath $edge -ArgumentList @(
                "--headless", "--disable-gpu", "--screenshot=$PWD\hlavne-$panel-$tema.png",
                "--window-size=1100,1400", "--virtual-time-budget=4000",
                "file:///$($cesta -replace '\\','/')?tema=$tema"
              ) -NoNewWindow -Wait -PassThru
              Write-Host "$panel/$tema — Edge exit code: $($p.ExitCode)"
            }
          }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hlavne-nahlad
          path: hlavne-panel-*.png
          if-no-files-found: warn

      - name: Náhľad výberu „Torture Instrument" (TLI 25) ako obrázok (artefakt behu)
        shell: pwsh
        run: |
          # Rovnaký mechanizmus ako pri Frozen Canvas, len `nahlad-nastroj.html`/.js
          # podsunie mock odpoveď `faza: "hotovo_nastroj"` — tri kartičky z Richardovho
          # skutočného screenshotu zo 17.10.2026 s tiermi z `nastroje-ss14.json`.
          $edge = @(
            "C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe",
            "C:\Program Files\Microsoft\Edge\Application\msedge.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $edge) { Write-Warning "Edge sa nenašiel, náhľad preskakujem."; exit 0 }
          $cesta = (Resolve-Path "ui/nahlad-nastroj.html").Path
          $p = Start-Process -FilePath $edge -ArgumentList @(
            "--headless", "--disable-gpu", "--screenshot=$PWD\overlay-nahlad-nastroj.png",
            "--window-size=1600,900", "--virtual-time-budget=4000",
            "file:///$($cesta -replace '\\','/')"
          ) -NoNewWindow -Wait -PassThru
          Write-Host "Edge exit code: $($p.ExitCode)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: overlay-nahlad-nastroj
          path: overlay-nahlad-nastroj.png
          if-no-files-found: warn

      - name: Náhľad univerzálneho poradcu (TLI 36) ako obrázok (artefakt behu)
        shell: pwsh
        run: |
          # Rovnaký mechanizmus ako pri výbere nástroja, len `nahlad-poradca.html`/.js
          # podsunie mock odpoveď `faza: "hotovo_poradca"` — tri tlačidlá panela
          # „Make Your Decision" z Richardovej snímky 18.10.2026 13:16:48,
          # presne s tými boxmi, ktoré poradca naživo vrátil.
          $edge = @(
            "C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe",
            "C:\Program Files\Microsoft\Edge\Application\msedge.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $edge) { Write-Warning "Edge sa nenašiel, náhľad preskakujem."; exit 0 }
          $cesta = (Resolve-Path "ui/nahlad-poradca.html").Path
          $p = Start-Process -FilePath $edge -ArgumentList @(
            "--headless", "--disable-gpu", "--screenshot=$PWD\overlay-nahlad-poradca.png",
            "--window-size=1600,900", "--virtual-time-budget=4000",
            "file:///$($cesta -replace '\\','/')"
          ) -NoNewWindow -Wait -PassThru
          Write-Host "Edge exit code: $($p.ExitCode)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: overlay-nahlad-poradca
          path: overlay-nahlad-poradca.png
          if-no-files-found: warn

      - name: Náhľad obrazovky Objective (TLI 37) ako obrázok (artefakt behu)
        shell: pwsh
        run: |
          # Rovnaký mechanizmus ako pri poradcovi, len `nahlad-objective.html`/.js
          # podsunie mock odpoveď `faza: "hotovo_objective"` — cieľ behu
          # „Survival of the Fittest" (Consume 4 times) z Richardovej snímky
          # 18.10.2026 13:23:25, aj s box-om tlačidla Confirm.
          $edge = @(
            "C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe",
            "C:\Program Files\Microsoft\Edge\Application\msedge.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $edge) { Write-Warning "Edge sa nenašiel, náhľad preskakujem."; exit 0 }
          $cesta = (Resolve-Path "ui/nahlad-objective.html").Path
          $p = Start-Process -FilePath $edge -ArgumentList @(
            "--headless", "--disable-gpu", "--screenshot=$PWD\overlay-nahlad-objective.png",
            "--window-size=1600,900", "--virtual-time-budget=4000",
            "file:///$($cesta -replace '\\','/')"
          ) -NoNewWindow -Wait -PassThru
          Write-Host "Edge exit code: $($p.ExitCode)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: overlay-nahlad-objective
          path: overlay-nahlad-objective.png
          if-no-files-found: warn

      - name: Náhľad mini-overlayu — snímka
        shell: pwsh
        run: |
          $edge = @(
            "C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe",
            "C:\Program Files\Microsoft\Edge\Application\msedge.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $edge) { Write-Warning "Edge sa nenašiel, náhľad preskakujem."; exit 0 }
          $cesta = (Resolve-Path "ui/nahlad-mini.html").Path
          $p = Start-Process -FilePath $edge -ArgumentList @(
            "--headless", "--disable-gpu", "--screenshot=$PWD\mini-nahlad.png",
            # TLI 25: Edge headless má MINIMÁLNU šírku okna (~500 px) a menšiu
            # hodnotu ticho ignoruje — pri `320` sa stránka vykreslila 500 px
            # široká a pravý okraj panela (FE/h, ceny dropov) padol mimo snímku.
            # Šírku panela drží `html, body { width: 280px }` z `nahlad-generuj.py`,
            # okno je zámerne väčšie, nech je vidieť aj jeho okraj.
            "--window-size=520,260", "--virtual-time-budget=4000",
            "file:///$($cesta -replace '\\','/')"
          ) -NoNewWindow -Wait -PassThru
          Write-Host "Edge exit code: $($p.ExitCode)"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mini-nahlad
          path: mini-nahlad.png
          if-no-files-found: warn

      - name: Náhľad pripomienky Enable Log (TLI 11d) — snímka
        shell: pwsh
        run: |
          $edge = @(
            "C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe",
            "C:\Program Files\Microsoft\Edge\Application\msedge.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $edge) { Write-Warning "Edge sa nenašiel, náhľad preskakujem."; exit 0 }
          $cesta = (Resolve-Path "ui/nahlad-pripomienka.html").Path
          $p = Start-Process -FilePath $edge -ArgumentList @(
            "--headless", "--disable-gpu", "--screenshot=$PWD\pripomienka-nahlad.png",
            "--window-size=520,150", "--virtual-time-budget=4000",
            "file:///$($cesta -replace '\\','/')"
          ) -NoNewWindow -Wait -PassThru
          Write-Host "Edge exit code: $($p.ExitCode)"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pripomienka-nahlad
          path: pripomienka-nahlad.png
          if-no-files-found: warn
