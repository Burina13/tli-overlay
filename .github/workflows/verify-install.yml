# Dôkaz, že MSI z releasu sa nainštaluje na ČISTOM Windowse, prihlási sa ako
# vlastný produkt s vlastným upgrade code a dá sa odinštalovať.
# Spúšťa sa ručne po releasi: gh workflow run verify-install.yml -f tag=tli-v0.1.0
name: Overenie inštalácie

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag releasu, ktorého MSI sa má overiť"
        required: true
        default: "tli-v0.1.0"
      stara_verzia:
        description: "Tag STARÉHO releasu pre job `migracia` (musí byť NIŽŠÍ než `tag`, inak NSIS migrácia nemá čo robiť — rovnaká verzia sa „migruje“ na samu seba a test by prešiel naprázdno). Predvolené tli-v0.20.4 = posledný čisto-MSI release pred NSIS (TLI 52)."
        required: false
        default: "tli-v0.20.4"

jobs:
  migracia:
    # TLI 52 krok 3, poistka pred zapnutím `installerUrl`/`installerSha256`
    # (`STAV.md` → `ROZPRACOVANE: TLI 52`, zadanie `2026-10-20-0019-agent.md`
    # bod 6): overuje presne tú cestu, akou prejde KAŽDÝ dnešný hráč pri
    # prvej tichej aktualizácii — stará perMachine MSI nainštalovaná →
    # appka spustí nový NSIS presne s argumentmi z `pokus_o_tichu_aktualizaciu`
    # (`main.rs`) → stará MSI musí zmiznúť z HKLM Uninstall, nová perUser
    # verzia musí byť v HKCU Uninstall a NASTAVENIA/LOGY hráča v
    # `%APPDATA%\sk.tvojtatko.tli-overlay\` musia migráciu prežiť nedotknuté
    # (`/UPDATE` to sľubuje, tento test to overuje naživo, nie len zo zdroja
    # šablóny).
    name: Migrácia stará MSI → nová NSIS (TLI 52 poistka)
    runs-on: windows-latest
    steps:
      - name: Stiahnuť STARÚ MSI (iný, nižší tag), NOVÝ NSIS setup.exe a kontrolné súčty
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ inputs.tag }}"
          $staryTag = "${{ inputs.stara_verzia }}"
          if ($staryTag -eq $tag) {
            throw "stara_verzia ($staryTag) sa rovná tag ($tag) — migrácia na rovnakú verziu nič neoverí (NSIS šablóna nemá dôvod meniť nič), zvoľ nižší stara_verzia"
          }
          $hlavicky = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept        = "application/vnd.github+json"
          }
          $relNova = Invoke-RestMethod "https://api.github.com/repos/Burina13/tli-overlay/releases/tags/$tag" -Headers $hlavicky
          $relStara = Invoke-RestMethod "https://api.github.com/repos/Burina13/tli-overlay/releases/tags/$staryTag" -Headers $hlavicky

          $msi = $relStara.assets | Where-Object name -like "*.msi" | Select-Object -First 1
          $nsis = $relNova.assets | Where-Object name -like "*-setup.exe" | Select-Object -First 1
          $sumsStara = $relStara.assets | Where-Object name -eq "SHA256SUMS.txt" | Select-Object -First 1
          $sumsNova = $relNova.assets | Where-Object name -eq "SHA256SUMS.txt" | Select-Object -First 1
          if (-not $msi) { throw "release $staryTag (stara_verzia) nemá .msi asset" }
          if (-not $nsis) { throw "release $tag nemá *-setup.exe asset — tento tag ešte nestaval NSIS target (TLI 52)" }
          Invoke-WebRequest $msi.browser_download_url -OutFile stara.msi
          Invoke-WebRequest $nsis.browser_download_url -OutFile novy-setup.exe
          Invoke-WebRequest $sumsStara.browser_download_url -OutFile SHA256SUMS-stara.txt
          Invoke-WebRequest $sumsNova.browser_download_url -OutFile SHA256SUMS-nova.txt

          foreach ($pair in @(@{subor="stara.msi"; nazov=$msi.name; sums="SHA256SUMS-stara.txt"},
                               @{subor="novy-setup.exe"; nazov=$nsis.name; sums="SHA256SUMS-nova.txt"})) {
            $riadok = (Get-Content $pair.sums) | Where-Object { $_ -match [regex]::Escape($pair.nazov) }
            if (-not $riadok) { throw "$($pair.sums) neobsahuje riadok pre $($pair.nazov)" }
            $ocakavany = ($riadok -split '\s+')[0]
            $skutocny = (Get-FileHash $pair.subor -Algorithm SHA256).Hash.ToLower()
            if ($ocakavany -ne $skutocny) { throw "SHA256 nesedí pre $($pair.nazov): $skutocny vs $ocakavany" }
          }
          $verzia = $tag -replace '^tli-v', ''
          $staraVerzia = $staryTag -replace '^tli-v', ''
          Write-Host "stara_verzia=$staryTag ($staraVerzia) -> tag=$tag ($verzia)"
          "VERZIA=$verzia" >> $env:GITHUB_ENV
          "STARA_VERZIA=$staraVerzia" >> $env:GITHUB_ENV

      - name: Nainštalovať STARÚ MSI (simuluje existujúceho hráča pred migráciou)
        shell: pwsh
        run: |
          Start-Process msiexec -ArgumentList '/i','stara.msi','/qn','/norestart' -Wait
          if (-not (Test-Path "C:\Program Files\Tvoj Tatko TLI Overlay")) {
            throw "stará MSI sa nenainštalovala — predpoklad testu neplatí"
          }
          $zaznam = Get-ItemProperty "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*",
                                     "HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*" `
                                     -ErrorAction SilentlyContinue | Where-Object DisplayName -eq "Tvoj Tatko TLI Overlay"
          if (-not $zaznam) { throw "stará MSI nie je v HKLM Uninstall — predpoklad testu neplatí" }
          if ($zaznam.DisplayVersion -ne $env:STARA_VERZIA) {
            throw "nainštalovaná stará MSI má verziu $($zaznam.DisplayVersion), čakala sa $env:STARA_VERZIA — stiahol sa zlý asset"
          }
          Write-Host "stará MSI ($($zaznam.DisplayVersion)) nainštalovaná, HKLM Uninstall záznam existuje"

      - name: Vložiť marker do %APPDATA% (nastavenia/logy, ktoré MUSIA prežiť)
        shell: pwsh
        run: |
          $priecinok = Join-Path $env:APPDATA "sk.tvojtatko.tli-overlay"
          New-Item -ItemType Directory -Force -Path $priecinok | Out-Null
          New-Item -ItemType Directory -Force -Path (Join-Path $priecinok "logs") | Out-Null
          '{"marker_test_migracie_tli52": "pred-migraciou-12345"}' |
            Set-Content -Path (Join-Path $priecinok "nastavenia.json") -Encoding utf8 -NoNewline
          'marker log pred migráciou TLI 52' |
            Set-Content -Path (Join-Path $priecinok "logs\tli-overlay.log") -Encoding utf8 -NoNewline

      - name: Spustiť NOVÝ NSIS presne s argumentmi z pokus_o_tichu_aktualizacie (main.rs)
        shell: pwsh
        run: |
          # `/S /UPDATE /R /ARGS ""` — presne to, čo appka sama posiela pri
          # tichej aktualizácii (main.rs:pokus_o_tichu_aktualizaciu). Jediný
          # rozdiel oproti produkcii: appku tu nespúšťa Rust proces, ale CI
          # krok priamo — scenár na disku (stará MSI + nastavenia v %APPDATA%)
          # je identický.
          $p = Start-Process -FilePath (Resolve-Path novy-setup.exe).Path -ArgumentList '/S /UPDATE /R /ARGS ""' -PassThru
          $p.WaitForExit(120000) | Out-Null
          if (-not $p.HasExited) { throw "NSIS inštalátor nedobehol do 120 s" }
          if ($p.ExitCode -ne 0) { throw "NSIS inštalátor skončil s kódom $($p.ExitCode)" }
          # `/R` appku po dokončení reštartuje — v CI ju netreba, len nech
          # nezostane bežať a nezablokuje nasledujúce kroky/upratovanie runnera.
          Start-Sleep -Seconds 5
          Get-Process -Name "Tvoj Tatko TLI Overlay" -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue

      - name: Diagnostika (vždy, aj keď ďalší krok zlyhá — čo presne NSIS spravil)
        shell: pwsh
        if: always()
        run: |
          Write-Host "--- HKLM Uninstall (náš produkt) ---"
          Get-ItemProperty "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*",
                            "HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*" `
                            -ErrorAction SilentlyContinue | Where-Object DisplayName -eq "Tvoj Tatko TLI Overlay" |
            Format-List DisplayName, DisplayVersion, InstallLocation, UninstallString, InstallDate | Out-String | Write-Host
          Write-Host "--- HKCU Uninstall (náš produkt) ---"
          Get-ItemProperty "HKCU:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*" -ErrorAction SilentlyContinue |
            Where-Object DisplayName -eq "Tvoj Tatko TLI Overlay" |
            Format-List DisplayName, DisplayVersion, InstallLocation, UninstallString, InstallDate | Out-String | Write-Host
          Write-Host "--- $env:LOCALAPPDATA hľadanie exe ---"
          Get-ChildItem -Path $env:LOCALAPPDATA -Recurse -Filter "Tvoj Tatko TLI Overlay.exe" -ErrorAction SilentlyContinue |
            Select-Object FullName, @{n="Verzia";e={$_.VersionInfo.ProductVersion}} | Format-Table | Out-String | Write-Host
          Write-Host "--- C:\Program Files\Tvoj Tatko TLI Overlay ---"
          Get-ChildItem "C:\Program Files\Tvoj Tatko TLI Overlay" -ErrorAction SilentlyContinue | Format-Table Name, LastWriteTime | Out-String | Write-Host

      - name: Stará MSI zmizla z HKLM Uninstall (vstavaná migrácia NSIS šablóny)
        shell: pwsh
        run: |
          $stara = Get-ItemProperty "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*",
                                     "HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*" `
                                     -ErrorAction SilentlyContinue | Where-Object DisplayName -eq "Tvoj Tatko TLI Overlay"
          if ($stara) {
            throw "stará perMachine MSI je STÁLE v HKLM Uninstall po migrácii — self-update by hráčovi nechal dva nainštalované produkty: $($stara | Format-List | Out-String)"
          }
          Write-Host "stará MSI je preč z HKLM Uninstall — migrácia prebehla"

      - name: Nová perUser verzia je naozaj nainštalovaná a funguje (HKCU + log)
        shell: pwsh
        run: |
          $zaznam = Get-ItemProperty "HKCU:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*" -ErrorAction SilentlyContinue |
                    Where-Object DisplayName -eq "Tvoj Tatko TLI Overlay"
          if (-not $zaznam) { throw "nová perUser appka nie je v HKCU Uninstall — migrácia neskončila inštaláciou novej verzie" }
          Write-Host "nová verzia v registri: $($zaznam.DisplayVersion)"
          if ($zaznam.DisplayVersion -ne $env:VERZIA) {
            throw "HKCU DisplayVersion $($zaznam.DisplayVersion) nesedí s tagom $env:VERZIA"
          }

          $instalDir = $zaznam.InstallLocation
          if (-not $instalDir -or -not (Test-Path $instalDir)) {
            $najdeny = Get-ChildItem -Path $env:LOCALAPPDATA -Recurse -Filter "Tvoj Tatko TLI Overlay.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
            if (-not $najdeny) { throw "exe novej perUser appky sa nenašlo pod $env:LOCALAPPDATA" }
            $instalDir = $najdeny.DirectoryName
          }
          $exe = Get-ChildItem $instalDir -Filter *.exe | Select-Object -First 1
          if (-not $exe) { throw "priečinok $instalDir neobsahuje žiadne .exe" }
          if ($exe.VersionInfo.ProductVersion -notlike "$env:VERZIA*") {
            throw "nainštalované exe má verziu $($exe.VersionInfo.ProductVersion), čakal sa $env:VERZIA"
          }

          # Funkčný dôkaz, nielen registry — rovnaký vzor ako `install` job nižšie.
          $logPath = Join-Path $env:APPDATA "sk.tvojtatko.tli-overlay\logs\tli-overlay.log"
          Remove-Item $logPath -Force -ErrorAction SilentlyContinue
          $proc = Start-Process -FilePath $exe.FullName -PassThru
          Start-Sleep -Seconds 10
          if ($proc.HasExited) { throw "migrovaná appka po 10 s nebeží (exit code $($proc.ExitCode))" }
          if (-not (Test-Path $logPath) -or ((Get-Content $logPath -Raw) -notmatch "registrácia OK")) {
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
            throw "migrovaná appka nezapísala úspešnú registráciu klávesovej skratky do denníka"
          }
          Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          Write-Host "nová perUser appka po migrácii naozaj beží"

      - name: Nastavenia/logy v %APPDATA% prežili migráciu NEDOTKNUTÉ (/UPDATE)
        shell: pwsh
        run: |
          $subor = Join-Path $env:APPDATA "sk.tvojtatko.tli-overlay\nastavenia.json"
          if (-not (Test-Path $subor)) {
            throw "$subor po migrácii zmizol — /UPDATE malo nastavenia hráča zachovať"
          }
          $obsah = Get-Content $subor -Raw
          if ($obsah -notmatch "pred-migraciou-12345") {
            throw "marker v nastaveniach po migrácii zmizol/bol prepísaný (obsah: $obsah) — /UPDATE nezachovalo pôvodný súbor"
          }
          Write-Host "nastavenia hráča prežili migráciu nedotknuté: $obsah"

      - name: Odinštalovať novú perUser appku (upratanie runnera)
        shell: pwsh
        run: |
          $zaznam = Get-ItemProperty "HKCU:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*" -ErrorAction SilentlyContinue |
                    Where-Object DisplayName -eq "Tvoj Tatko TLI Overlay"
          if ($zaznam -and $zaznam.UninstallString) {
            Start-Process cmd -ArgumentList "/c", $zaznam.UninstallString, "/S" -Wait -ErrorAction SilentlyContinue
          }

  install:
    name: Inštalácia na čistom Windowse
    runs-on: windows-latest
    steps:
      - name: Stiahnuť MSI a kontrolný súčet
        shell: pwsh
        env:
          # Bez tokenu ide volanie API anonymne, teda proti limitu 60 dotazov za
          # hodinu NA IP — a tú IP zdieľajú všetky GitHub runnery. 15.10.2026 to
          # zhodilo overenie `tli-v0.5.0` hneď na prvom riadku („API rate limit
          # exceeded for 104.209.12.64"), hoci MSI aj súčet boli v poriadku.
          # S tokenom je limit 1000/h na repozitár a tento zdroj zlyhania mizne.
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ inputs.tag }}"
          $hlavicky = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept        = "application/vnd.github+json"
          }
          $rel = Invoke-RestMethod "https://api.github.com/repos/Burina13/tli-overlay/releases/tags/$tag" -Headers $hlavicky
          $msi = $rel.assets | Where-Object name -like "*.msi" | Select-Object -First 1
          $sums = $rel.assets | Where-Object name -eq "SHA256SUMS.txt" | Select-Object -First 1
          Invoke-WebRequest $msi.browser_download_url -OutFile overlay.msi
          Invoke-WebRequest $sums.browser_download_url -OutFile SHA256SUMS.txt
          $ocakavany = ((Get-Content SHA256SUMS.txt) -split '\s+')[0]
          $skutocny = (Get-FileHash overlay.msi -Algorithm SHA256).Hash.ToLower()
          if ($ocakavany -ne $skutocny) { throw "SHA256 nesedí: $skutocny vs $ocakavany" }
          Write-Host "SHA256 sedí: $skutocny"

      - name: Nainštalovať
        shell: pwsh
        run: |
          Start-Process msiexec -ArgumentList '/i','overlay.msi','/qn','/norestart' -Wait
          if (-not (Test-Path "C:\Program Files\Tvoj Tatko TLI Overlay")) {
            throw "appka nie je v Program Files"
          }

      - name: Je to vlastný produkt s vlastným upgrade code
        shell: pwsh
        run: |
          $zaznamy = Get-ItemProperty "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*",
                                      "HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*" `
                                      -ErrorAction SilentlyContinue
          $moj = $zaznamy | Where-Object DisplayName -eq "Tvoj Tatko TLI Overlay"
          if (-not $moj) { throw "chýba položka v Pridať alebo odstrániť programy" }
          Write-Host "$($moj.DisplayName) $($moj.DisplayVersion), vydavateľ $($moj.Publisher)"
          $exe = Get-ChildItem "C:\Program Files\Tvoj Tatko TLI Overlay" -Filter *.exe | Select-Object -First 1
          Write-Host "exe: $($exe.Name), produkt: $($exe.VersionInfo.ProductName), verzia: $($exe.VersionInfo.ProductVersion)"
          if ($exe.VersionInfo.ProductName -ne "Tvoj Tatko TLI Overlay") { throw "zlý ProductName v EXE" }

      - name: MSI má NÁŠ pripnutý WiX upgrade code
        shell: pwsh
        run: |
          # Toto je presne poistka proti incidentu A2Tools z 13.10.2026: keď sa
          # upgrade code odvodí z názvu produktu, cudzia appka s rovnakým názvom
          # náš build pri aktualizácii prepíše. Náš je pripnutý v tauri.conf.json.
          $ocakavany = "{D4DAC792-734C-507D-9004-D1DAE51A2874}"
          $inst = New-Object -ComObject WindowsInstaller.Installer
          $db = $inst.GetType().InvokeMember("OpenDatabase", "InvokeMethod", $null, $inst, @((Resolve-Path overlay.msi).Path, 0))
          $v = $db.GetType().InvokeMember("OpenView", "InvokeMethod", $null, $db, @("SELECT Value FROM Property WHERE Property = 'UpgradeCode'"))
          $v.GetType().InvokeMember("Execute", "InvokeMethod", $null, $v, $null) | Out-Null
          $r = $v.GetType().InvokeMember("Fetch", "InvokeMethod", $null, $v, $null)
          $najdeny = $r.GetType().InvokeMember("StringData", "GetProperty", $null, $r, 1)
          Write-Host "UpgradeCode v MSI: $najdeny"
          if ($najdeny.ToUpper() -ne $ocakavany) { throw "zlý UpgradeCode: $najdeny (čakal sa $ocakavany)" }

      - name: Appka sa po inštalácii naozaj spustí (TLI 42, WebView2 0x8007139F)
        shell: pwsh
        run: |
          # 0.18.14/0.18.15 mali v `tauri.conf.json` `additionalBrowserArgs` len
          # na okne `overlay`, ostatné 4 okná ho nemali — WebView2 odmietol
          # vytvoriť viac než jedno okno nad tým istým user-data-folderom s
          # rôznymi argumentmi a appka hneď pri štarte panikárila
          # (`Failed to setup app: ... WebView2 error: ... 0x8007139F`), bez
          # toho, aby to dovtedajší test (inštalácia + odinštalácia) vôbec
          # zachytil. Táto appka beží ako GUI bez konzoly
          # (`windows_subsystem = "windows"`), takže panika sa neukáže v
          # stdout/stderr procesu — jediný spoľahlivý dôkaz „appka naozaj
          # nabehla" je, že proces po chvíli stále beží A stihla zapísať do
          # svojho denníka aspoň jednu úspešnú registráciu klávesovej skratky.
          $exe = Get-ChildItem "C:\Program Files\Tvoj Tatko TLI Overlay" -Filter *.exe | Select-Object -First 1
          $logPath = Join-Path $env:APPDATA "sk.tvojtatko.tli-overlay\logs\tli-overlay.log"
          if (Test-Path $logPath) { Remove-Item $logPath -Force }

          $proc = Start-Process -FilePath $exe.FullName -PassThru
          Start-Sleep -Seconds 10

          if ($proc.HasExited) {
            throw "appka po 10 s nebeží (exit code $($proc.ExitCode)) — release sa nespustí u hráča, nesmie prejsť CI"
          }

          if (-not (Test-Path $logPath)) {
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
            throw "appka beží, ale denník $logPath vôbec nevznikol — setup appky sa nedostal ani k prvému zápisu"
          }

          $log = Get-Content $logPath -Raw
          Write-Host $log
          if ($log -notmatch "registrácia OK") {
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
            throw "denník neobsahuje žiadnu úspešnú registráciu klávesovej skratky (`"registrácia OK`") — appka nedobehla setup"
          }

          Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          Write-Host "appka po 10 s beží a klávesové skratky sú zaregistrované"

      - name: V binárke nie je cudzí aktualizačný endpoint
        shell: pwsh
        run: |
          $exe = Get-ChildItem "C:\Program Files\Tvoj Tatko TLI Overlay" -Filter *.exe | Select-Object -First 1
          $text = [System.Text.Encoding]::ASCII.GetString([System.IO.File]::ReadAllBytes($exe.FullName))
          $nas = $text.Contains("latest-tli.json")
          Write-Host "náš manifest v binárke: $nas"
          foreach ($cudzi in @("a2tools.app", "latest-party.json", "latest-v2.json")) {
            if ($text.Contains($cudzi)) { throw "v binárke je cudzí endpoint: $cudzi" }
          }

      - name: Odinštalovať
        shell: pwsh
        run: |
          $zaznam = Get-ItemProperty "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*",
                                     "HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*" `
                                     -ErrorAction SilentlyContinue |
                    Where-Object DisplayName -eq "Tvoj Tatko TLI Overlay" | Select-Object -First 1
          $kod = $zaznam.PSChildName
          Start-Process msiexec -ArgumentList "/x", $kod, "/qn", "/norestart" -Wait
          if (Test-Path "C:\Program Files\Tvoj Tatko TLI Overlay") {
            throw "po odinštalovaní ostal priečinok"
          }
          Write-Host "odinštalované čisto"
