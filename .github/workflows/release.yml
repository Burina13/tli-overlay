# Zostaví MSI a pripne ho k releasu. Spúšťa sa tagom `tli-v*`, alebo ručne
# (vtedy MSI vznikne len ako artefakt behu, bez releasu).
name: Release MSI

on:
  push:
    tags: ["tli-v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  msi:
    name: Windows MSI
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Tauri CLI
        run: cargo install tauri-cli --version "^2.0" --locked
      - name: Build MSI
        run: cargo tauri build
      - name: Premenovať MSI (bez medzier v názve)
        shell: pwsh
        run: |
          Get-ChildItem src-tauri/target/release/bundle/msi/*.msi | ForEach-Object {
            $nove = $_.Name -replace ' ', '-'
            if ($nove -ne $_.Name) { Rename-Item $_.FullName $nove }
          }
          Get-ChildItem src-tauri/target/release/bundle/msi/
      - name: SHA256
        shell: pwsh
        run: |
          Get-ChildItem src-tauri/target/release/bundle/msi/*.msi | ForEach-Object {
            $h = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            Add-Content -Path SHA256SUMS.txt -Value "$h  $($_.Name)" -Encoding ascii
          }
          Get-Content SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: msi
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            SHA256SUMS.txt
      - name: Release (len pri tagu)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            src-tauri/target/release/bundle/msi/*.msi
            SHA256SUMS.txt
